name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare SpoofDPI source
        shell: pwsh
        run: |
          curl.exe -L https://github.com/xvzc/spoofdpi/archive/refs/tags/v1.2.1.zip -o spoofdpi-v1.2.1.zip
          Expand-Archive spoofdpi-v1.2.1.zip -DestinationPath .
          New-Item -ItemType Directory -Force SpoofDPI-1.2.1 | Out-Null
          Move-Item spoofdpi-1.2.1 SpoofDPI-1.2.1\SpoofDPI-1.2.1

      - name: Build proxy sidecar
        run: npm run build-proxy

      - name: Prepare Npcap resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\binaries | Out-Null
          curl.exe -L https://dev-libs.wireshark.org/windows/packages/Npcap/npcap-1.80.exe -o src-tauri\binaries\npcap-installer.exe

      - name: Run tests
        run: npm test

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kelle-dpi-bypass-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
